[project]
name = "agentcitadel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "clouddevopswmatt", email = "clouddevopswmatt@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlite-vec>=0.1.9",
    "typer>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[project.scripts]
citadel = "agentcitadel.cli.main:app"

[project.optional-dependencies]
guard-local = [
  "torch>=2.3; platform_system != 'Darwin' or platform_machine == 'arm64'",
  "transformers>=4.44; platform_system != 'Darwin' or platform_machine == 'arm64'",
]
pii = ["presidio-analyzer", "presidio-anonymizer"]
otel = ["opentelemetry-sdk", "opentelemetry-exporter-otlp"]
postgres = ["asyncpg"]
litellm = ["litellm"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda", marker = "sys_platform == 'linux'" }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
[tool.mypy]
strict = true
